<main class="container">
  <div class="detail-layout">
    <div>
      <div class="detail-card">
        <h1 class="section__title">Choose a payment method</h1>
        <div class="option-list">
          <button class="option-row option-row--selected" type="button">
            <img src="../../icons/payment/fawry-payment.svg" alt="">
            <span class="option-row__body">
              <span class="option-row__title">Fawry</span>
              <span class="option-row__meta">Pay at any Fawry outlet within 24 hours</span>
            </span>
          </button>
          <button class="option-row" type="button">
            <img src="../../icons/payment/vodafone-cash.svg" alt="">
            <span class="option-row__body">
              <span class="option-row__title">Vodafone Cash</span>
              <span class="option-row__meta">Pay from your mobile wallet</span>
            </span>
          </button>
          <button class="option-row" type="button">
            <img src="../../icons/payment/orange-money-en.svg" alt="">
            <span class="option-row__body">
              <span class="option-row__title">Orange Money</span>
              <span class="option-row__meta">Pay from your mobile wallet</span>
            </span>
          </button>
          <button class="option-row" type="button">
            <img src="../../icons/payment/valu.svg" alt="">
            <span class="option-row__body">
              <span class="option-row__title">ValU</span>
              <span class="option-row__meta">Split into monthly instalments</span>
            </span>
          </button>
          <button class="option-row" type="button">
            <img src="../../icons/payment/credit-card.svg" alt="">
            <span class="option-row__body">
              <span class="option-row__title">Credit or debit card</span>
              <span class="option-row__meta">Visa, Mastercard, Meeza</span>
            </span>
          </button>
        </div>
      </div>
    </div>

    <aside>
      <div class="detail-card">
        <h2 class="filter-group__title">Order summary</h2>
        <dl class="spec-table">
          <div class="spec-row"><dt>Featured ad — 7 days</dt><dd>EGP 350</dd></div>
          <div class="spec-row"><dt>Boost to top — 3 days</dt><dd>EGP 150</dd></div>
          <div class="spec-row"><dt>VAT (14%)</dt><dd>EGP 70</dd></div>
        </dl>
        <p class="detail-price">EGP 570</p>
        <div class="contact-stack">
          <button class="btn btn--primary btn--lg btn--block" type="button">Pay with Fawry</button>
        </div>
      </div>
    </aside>
  </div>
</main>
