<!--@ {"title":"Choose a payment method | dubizzle Egypt","header":"none","bodyClass":"page-bg-search","note":"Same real EG payment rails, stacked."} @-->

<header class="header-mobile">
  <div class="header-mobile__top">
    <a class="header-mobile__back" href="#"><img src="../../icons/navigation/back.svg" alt="Back"></a>
    <h1 class="header-mobile__title">Payment</h1>
    <div class="header-mobile__actions"></div>
  </div>
</header>

<main class="container">
  <div class="detail-card">
    <h2 class="filter-group__title">Order summary</h2>
    <dl class="spec-table">
      <div class="spec-row"><dt>Featured ad — 7 days</dt><dd>EGP 350</dd></div>
      <div class="spec-row"><dt>Boost to top — 3 days</dt><dd>EGP 150</dd></div>
      <div class="spec-row"><dt>VAT (14%)</dt><dd>EGP 70</dd></div>
    </dl>
    <p class="detail-price">EGP 570</p>
  </div>

  <div class="detail-card">
    <h2 class="filter-group__title">Payment method</h2>
    <div class="option-list">
      <button class="option-row option-row--selected" type="button">
        <img src="../../icons/payment/fawry-payment.svg" alt="">
        <span class="option-row__body">
          <span class="option-row__title">Fawry</span>
          <span class="option-row__meta">Pay at any Fawry outlet</span>
        </span>
      </button>
      <button class="option-row" type="button">
        <img src="../../icons/payment/vodafone-cash.svg" alt="">
        <span class="option-row__body"><span class="option-row__title">Vodafone Cash</span></span>
      </button>
      <button class="option-row" type="button">
        <img src="../../icons/payment/valu.svg" alt="">
        <span class="option-row__body"><span class="option-row__title">ValU</span></span>
      </button>
      <button class="option-row" type="button">
        <img src="../../icons/payment/credit-card.svg" alt="">
        <span class="option-row__body"><span class="option-row__title">Credit or debit card</span></span>
      </button>
    </div>
    <div class="contact-stack">
      <button class="btn btn--primary btn--lg btn--block" type="button">Pay EGP 570</button>
    </div>
  </div>
</main>
