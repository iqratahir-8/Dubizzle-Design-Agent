<!--@ {"title":"My Ads | dubizzle Egypt","header":"none","bodyClass":"page-bg-search","bottomNav":"ads","note":"Ads become list cards with a status pill and inline actions."} @-->

<header class="header-mobile">
  <div class="header-mobile__top">
    <h1 class="header-mobile__title">My Ads</h1>
  </div>
  <div class="tabs">
    <button class="tabs__tab tabs__tab--active">Active</button>
    <button class="tabs__tab">Pending</button>
    <button class="tabs__tab">Expired</button>
    <button class="tabs__tab">Drafts</button>
  </div>
</header>

<main class="container">
  <ul class="results-list">
    <li><article class="ad-list-card">
      <div class="ad-list-card__media media-placeholder media-placeholder--sm"></div>
      <div class="ad-list-card__body">
        <p class="ad-card__price">EGP 8,500,000</p>
        <h2 class="ad-card__title">Apartment for sale in Zamalek 200m</h2>
        <p class="ad-card__specs"><span>2,431 views</span> · <span>18 leads</span></p>
        <div class="ad-list-card__actions">
          <span class="pill pill--featured">Featured</span>
          <button class="btn btn--tertiary">Edit</button>
        </div>
      </div>
    </article></li>
    <li><article class="ad-list-card">
      <div class="ad-list-card__media media-placeholder media-placeholder--sm"></div>
      <div class="ad-list-card__body">
        <p class="ad-card__price">EGP 2,850,000</p>
        <h2 class="ad-card__title">Mercedes-Benz E200 2021 - 45,000 km</h2>
        <p class="ad-card__specs"><span>1,102 views</span> · <span>9 leads</span></p>
        <div class="ad-list-card__actions">
          <span class="pill pill--success">Live</span>
          <button class="btn btn--tertiary">Edit</button>
        </div>
      </div>
    </article></li>
    <li><article class="ad-list-card">
      <div class="ad-list-card__media media-placeholder media-placeholder--sm"></div>
      <div class="ad-list-card__body">
        <p class="ad-card__price">EGP 18,900</p>
        <h2 class="ad-card__title">Samsung 55 inch 4K smart TV</h2>
        <p class="ad-card__specs"><span>612 views</span> · <span>4 leads</span></p>
        <div class="ad-list-card__actions">
          <span class="pill pill--error">Expired</span>
          <button class="btn btn--secondary btn--sm">Repost</button>
        </div>
      </div>
    </article></li>
  </ul>
</main>
