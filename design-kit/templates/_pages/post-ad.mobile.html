<!--@ {"title":"Post Your Ad | dubizzle Egypt","header":"none","bodyClass":"page-bg-search","note":"Single-column posting form. Steps collapse to a progress line."} @-->

<header class="header-mobile">
  <div class="header-mobile__top">
    <a class="header-mobile__back" href="#"><img src="../../icons/navigation/back.svg" alt="Back"></a>
    <h1 class="header-mobile__title">Ad details</h1>
    <div class="header-mobile__actions"></div>
  </div>
  <div class="tabs">
    <button class="tabs__tab">Category</button>
    <button class="tabs__tab tabs__tab--active">Details</button>
    <button class="tabs__tab">Photos</button>
    <button class="tabs__tab">Review</button>
  </div>
</header>

<main class="container">
  <div class="detail-card">
    <form class="form">
      <div class="field">
        <label class="field__label" for="ad-title">Ad title</label>
        <input class="input" id="ad-title" type="text" placeholder="e.g. Apartment for sale in Zamalek 200m">
        <span class="field__hint">Include the area, size and finishing.</span>
      </div>
      <div class="field">
        <label class="field__label" for="ad-price">Price (EGP)</label>
        <input class="input" id="ad-price" type="text" placeholder="8,500,000">
      </div>
      <div class="field">
        <label class="field__label" for="ad-area">Area (m²)</label>
        <input class="input" id="ad-area" type="text" placeholder="200">
      </div>
      <div class="field">
        <span class="field__label">Bedrooms</span>
        <div class="filter-chips">
          <span class="chip">1</span>
          <span class="chip">2</span>
          <span class="chip chip--active">3</span>
          <span class="chip">4</span>
          <span class="chip">5+</span>
        </div>
      </div>
      <div class="field">
        <label class="field__label" for="ad-desc">Description</label>
        <textarea class="textarea" id="ad-desc" placeholder="Describe the property."></textarea>
      </div>
      <div class="field">
        <span class="field__label">Photos</span>
        <div class="upload-grid">
          <div class="upload-tile"><img src="../../icons/action/add-photo.svg" alt=""> Add</div>
          <div class="upload-tile media-placeholder media-placeholder--sm"></div>
          <div class="upload-tile media-placeholder media-placeholder--sm"></div>
        </div>
      </div>
      <button class="btn btn--primary btn--lg btn--block" type="button">Continue</button>
    </form>
  </div>
</main>
