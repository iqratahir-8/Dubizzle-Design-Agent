<!--@ {"title":"Chat | dubizzle Egypt","header":"none","bodyClass":"page-bg-search","note":"Thread view. The conversation list is a separate screen at this width."} @-->

<header class="header-mobile">
  <div class="header-mobile__top">
    <a class="header-mobile__back" href="#"><img src="../../icons/navigation/back.svg" alt="Back"></a>
    <h1 class="header-mobile__title">Ahmed H.</h1>
    <div class="header-mobile__actions">
      <a href="#"><img src="../../icons/action/call.svg" alt="Call"></a>
    </div>
  </div>
</header>

<main>
  <div class="conversation">
    <div class="ad-list-card__media media-placeholder media-placeholder--sm"></div>
    <div class="conversation__body">
      <p class="conversation__name">Apartment for sale in Zamalek 200m</p>
      <p class="conversation__preview">EGP 8,500,000</p>
    </div>
  </div>

  <div class="thread">
    <div class="bubble">
      Hi, is the apartment still available?
      <span class="bubble__time">10:42</span>
    </div>
    <div class="bubble bubble--own">
      Yes, still available.
      <span class="bubble__time">10:44</span>
    </div>
    <div class="bubble">
      Is the price negotiable?
      <span class="bubble__time">10:45</span>
    </div>
    <div class="bubble bubble--own">
      Slightly, for a serious buyer. Would you like to view it this week?
      <span class="bubble__time">10:47</span>
    </div>
  </div>

  <div class="composer">
    <label class="visually-hidden" for="msg">Message</label>
    <input class="input composer__input" id="msg" type="text" placeholder="Write a message...">
    <button class="btn btn--primary" type="button">Send</button>
  </div>
</main>
