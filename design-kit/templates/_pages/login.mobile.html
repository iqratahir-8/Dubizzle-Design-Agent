<!--@ {"title":"Login or Signup | dubizzle Egypt","header":"none","bodyClass":"page-bg-search","note":"Full-width auth form; the card border disappears at this width."} @-->

<header class="header-mobile">
  <div class="header-mobile__top">
    <a class="header-mobile__back" href="#"><img src="../../icons/navigation/back.svg" alt="Back"></a>
    <h1 class="header-mobile__title">Login or Signup</h1>
    <div class="header-mobile__actions"></div>
  </div>
</header>

<main class="container auth-shell">
  <div class="auth-card">
    <form class="form">
      <div class="field">
        <label class="field__label" for="phone">Mobile number</label>
        <input class="input" id="phone" type="tel" placeholder="010 0000 0000">
        <span class="field__hint">We'll send you a verification code.</span>
      </div>
      <button class="btn btn--primary btn--lg btn--block" type="button">Continue</button>
    </form>

    <div class="auth-divider">or continue with</div>

    <div class="option-list">
      <button class="option-row" type="button">
        <img src="../../icons/social/landing-facebook.svg" alt="">
        <span class="option-row__body"><span class="option-row__title">Continue with Facebook</span></span>
      </button>
      <button class="option-row" type="button">
        <img src="../../icons/action/email.svg" alt="">
        <span class="option-row__body"><span class="option-row__title">Continue with email</span></span>
      </button>
    </div>
  </div>
</main>
