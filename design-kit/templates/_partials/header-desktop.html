<!-- Three rows, matching live dubizzle.com.eg:
     1. Gray band — logo tab, Motors/Property verticals, user centre, Post Your Ad
     2. White row — location select + search field with charcoal submit
     3. White strip — top-level category nav (Vehicles … More Categories)
     The active vertical is a white tab bleeding into the row below. -->
<header class="header">
  <div class="header__band">
    <div class="container header__row1">
      <div class="header__brand-group">
        <a class="header__logo" href="#"><img src="../../icons/brand/logo-with-text.svg" alt="dubizzle, formerly OLX"></a>
        <a class="header__vertical{{motorsActive}}" href="#"><img src="../../icons/category/vehicles.svg" alt=""> Motors</a>
        <a class="header__vertical{{propertyActive}}" href="#"><img src="../../icons/property/apartment.svg" alt=""> Property</a>
      </div>
      <div class="header__user-group">
        <a class="header__user-link" href="#">
          <span class="header__user-badge"><img src="../../icons/action/notifications.svg" alt=""></span>
          <span>Notifications</span>
        </a>
        <a class="header__user-link" href="#">
          <img src="../../icons/action/heart.svg" alt="">
          <span>Favourites</span>
        </a>
        <a class="header__user-link" href="#">
          <img src="../../icons/action/chat.svg" alt="">
          <span>Chats</span>
        </a>
        <a class="header__lang" href="#">العربية</a>
        <button class="btn btn--primary header__cta">Post Your Ad</button>
      </div>
    </div>
  </div>

  <div class="container header__row2">
    <div class="header__location">
      <img src="../../icons/location/location-filled.svg" alt="">
      <span>Egypt</span>
      <img src="../../icons/navigation/chevron-down.svg" alt="">
    </div>
    <form class="header__search">
      <label class="visually-hidden" for="q">Search</label>
      <input id="q" type="search" placeholder="Find Cars, Mobile Phones and more...">
      <button class="header__search-btn" type="submit">
        <img src="../../icons/action/search.svg" alt=""> Search
      </button>
    </form>
  </div>

  <div class="header__nav-strip">
    <div class="container">
      <a class="header__nav-item" href="#">Vehicles</a>
      <a class="header__nav-item" href="#">Properties</a>
      <a class="header__nav-item" href="#">Mobiles &amp; Tablets</a>
      <a class="header__nav-item" href="#">Jobs</a>
      <a class="header__nav-item" href="#">Home &amp; Office Furniture - Decor</a>
      <a class="header__nav-item" href="#">Electronics &amp; Appliances</a>
      <a class="header__nav-item" href="#">More Categories</a>
    </div>
  </div>
</header>
